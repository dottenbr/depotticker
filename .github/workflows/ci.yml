name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct:
    name: Direct-download Mac app
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Versions agree
        run: |
          plist=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Support/Info.plist)
          build=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" Support/Info.plist)
          grep -q "MARKETING_VERSION: \"$plist\"" project.yml || { echo "project.yml and Support/Info.plist disagree on the version"; exit 1; }
          grep -q "CURRENT_PROJECT_VERSION: $build$" project.yml || { echo "project.yml and Support/Info.plist disagree on the build number"; exit 1; }
      - name: Unit tests
        run: swift test
      # The app as it ships: release build, widget extension, bundle, ad hoc signature.
      - name: Build the app bundle
        run: ./build.sh

  appstore:
    name: App Store builds (Mac, iPhone and iPad)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate the Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen
      # These builds have no Yahoo and no Sparkle code and include the widget; nothing else compiles them.
      - name: Build for macOS
        run: xcodebuild build -project Depotticker.xcodeproj -scheme Depotticker -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet
      - name: Build for iOS
        run: xcodebuild build -project Depotticker.xcodeproj -scheme Depotticker -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet

  site:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm --dir site exec astro build
